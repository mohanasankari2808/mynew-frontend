---
- name: Install Docker on Harbor server
  hosts: harbor
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Verify Docker
      command: docker --version
      register: docker_version

    - name: Show Docker version
      debug:
        var: docker_version.stdout
